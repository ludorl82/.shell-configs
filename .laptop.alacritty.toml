[window]
startup_mode = "Maximized"
title = "Alacritty"
dynamic_title = false
# macOS: make the left Option key send Alt (Meta) so tmux M-<key> bindings
# work, e.g. M-a.. in choose-tree (prefix w) to pick items beyond 9. Right
# Option keeps composing special/accented characters. Ignored elsewhere.
option_as_alt = "OnlyLeft"

[window.padding]
x = 4
y = 4


[font]
normal = { family = "Hack Nerd Font Mono" }
size = 14

[[keyboard.bindings]]
key = "B"
mods = "Control|Alt"
chars = "\u001b\u0002"

[[keyboard.bindings]]
key = "F"
mods = "Control|Alt"
chars = "\u001b\u0006"
